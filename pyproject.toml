[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verl"
dynamic = ["version"]
description = "Trace-Guided Policy Optimization (TGPO): AHAT training and subgoal evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "NOTICE"]
dependencies = ["PyYAML>=6,<7"]

authors = [
  {name = "Yang Li", email = "liyang372328@gmail.com"},
  {name = "Zhihong Liu", email = "253108100071@sii.edu.cn"},
]
keywords = ["TGPO", "GRPO", "robotics", "AHAT", "task-planning"]

[project.urls]
Repository = "https://github.com/Sii-liuzhihong/AHAT"
Homepage = "https://sii-liyang2024.github.io/ahat/"
Paper = "https://arxiv.org/abs/2602.12244"

[project.optional-dependencies]
download = ["huggingface-hub>=0.30,<1"]
data = ["numpy>=1.26,<2", "pandas>=2,<3", "pyarrow>=19,<20"]
eval = []
train = [
  "accelerate==1.7.0", "codetiming==1.4.0", "datasets>=3,<4", "dill>=0.3.8",
  "hydra-core==1.3.2", "numpy>=1.26,<2", "pandas>=2,<3", "peft==0.15.2",
  "pyarrow>=19,<20", "pybind11>=2.13", "pylatexenc==2.10", "ray[default]==2.52.1",
  "torch==2.7.0", "torchdata==0.11.0", "tensordict==0.8.3", "transformers==4.51.3",
  "wandb>=0.19,<0.20", "packaging>=24", "tensorboard>=2.19,<2.20",
]
inference = ["vllm==0.9.1", "transformers==4.51.3", "torch==2.7.0"]
test = ["pytest>=8,<10", "build>=1", "ruff>=0.11"]

[tool.setuptools.dynamic]
version = {file = "verl/version/version"}

[tool.setuptools.packages.find]
where = ["."]
include = ["verl*", "robot_planning*"]
exclude = ["tests*", "recipe*"]

[tool.setuptools.package-data]
verl = ["version/version", "trainer/*.yaml", "trainer/config/**/*.yaml", "trainer/config/*.yaml"]
robot_planning = ["prompts/**/*.txt", "prompts/*.txt", "prompts/**/*.json", "prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: executes an actual external solver, model, or training process",
  "source_parity: compares against the original development checkout",
  "gpu: requires a CUDA GPU",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
