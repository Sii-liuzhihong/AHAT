name: CPU evaluation and packaging
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install '.[data,test]'
      - run: BUILD_JOBS=2 bash scripts/setup_fast_downward.sh
      - run: python -m pytest tests/robot_planning -q
        env:
          FAST_DOWNWARD_PATH: ${{ github.workspace }}/third_party/fast-downward/fast-downward.py
      - run: python scripts/validation/verify_release.py
      - name: Check standalone utility entry points
        run: |
          python scripts/download_model.py --help
          python scripts/download_data.py --help
          python scripts/deploy_model.py --help
      - run: python -m build
      - run: python -m compileall -q robot_planning verl/trainer/tgpo
